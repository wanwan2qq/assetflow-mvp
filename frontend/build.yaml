targets:
  $default:
    builders:
      riverpod_generator:
        options:
          # Generate .g.dart files for Riverpod providers
          generate_for:
            - lib/**/*.dart
      json_serializable:
        options:
          # JSON serialization configuration
          any_map: false
          checked: false
          create_factory: true
          create_to_json: true
          disallow_unrecognized_keys: false
          explicit_to_json: false
          field_rename: none
          generic_argument_factories: false
          ignore_unannotated: false
          include_if_null: true
      freezed:
        options:
          # Freezed configuration for immutable classes
          generate_for:
            - lib/**/*.dart