- question: "首套房首付比例是多少？"
  answer: "首套房首付比例通常为30%，部分城市普通住宅可低至20%。公积金贷款首付最低20%。具体比例因城市和房屋类型有所不同。"
  category: "faq"
  keywords: ["首付", "首套房", "比例"]

- question: "房产证办理需要多长时间？"
  answer: "新房一般交房后1-2年内办理；二手房过户后5-15个工作日可领取不动产权证书。"
  category: "faq"
  keywords: ["房产证", "办理", "时间"]

- question: "契税是多少？"
  answer: "首套房：90平以下1%，90平以上1.5%。二套房：3%。非住宅：3%。"
  category: "faq"
  keywords: ["契税", "税费", "首套"]

- question: "公积金贷款和商业贷款的区别？"
  answer: "公积金贷款利率更低（约3.1%），但有额度限制；商业贷款利率较高（约3.85%），额度更灵活。可组合使用。"
  category: "faq"
  keywords: ["公积金", "商业贷款", "利率"]

- question: "买房需要准备哪些材料？"
  answer: "身份证、户口本、婚姻证明、收入证明、银行流水、首付款证明、征信报告。外地户籍还需社保或纳税证明。"
  category: "faq"
  keywords: ["材料", "购房", "证明"]

- question: "房贷提前还款划算吗？"
  answer: "取决于已还款年限和利率。等额本息还款前1/3周期提前还款较划算，后期提前还款意义不大。需考虑机会成本。"
  category: "faq"
  keywords: ["提前还款", "房贷", "划算"]

- question: "什么是LPR？"
  answer: "LPR是贷款市场报价利率，房贷利率=5年期LPR+加点。LPR每月20日公布，当前5年期LPR为3.85%。"
  category: "faq"
  keywords: ["LPR", "利率", "贷款"]

- question: "二手房交易流程是什么？"
  answer: "1.看房议价→2.签约付定金→3.网签备案→4.办理贷款→5.缴税过户→6.交房验收。全程约1-3个月。"
  category: "faq"
  keywords: ["二手房", "流程", "交易"]

- question: "满五唯一是什么意思？"
  answer: "满五：房产证满5年；唯一：卖方家庭名下唯一住房。满五唯一可免征个人所得税（20%或1%）。"
  category: "faq"
  keywords: ["满五唯一", "个税", "免税"]

- question: "什么情况下房子不能贷款？"
  answer: "房龄超过30年、小产权房、无房产证、抵押中、查封房、凶宅、违建等情况银行通常不予贷款。"
  category: "faq"
  keywords: ["贷款", "限制", "房龄"]
