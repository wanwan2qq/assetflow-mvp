- title: "北京市购房限购政策"
  category: "policy"
  city: "北京"
  content: |
    1. 京籍家庭：限购2套住房
    2. 非京籍家庭：需连续60个月社保或纳税，限购1套
    3. 通州区：京籍限购1套，非京籍需在通州连续缴纳3年社保或个税
    4. 单身人士（无论户籍）：限购1套
  summary: "北京限购政策：京籍2套，非京籍需60个月社保限1套"
  keywords: ["北京", "限购", "社保", "户籍"]
  conditions:
    city: "北京"
  source: "北京市住房和城乡建设委员会"
  priority: 10

- title: "北京市首套房贷款政策"
  category: "loan"
  city: "北京"
  content: |
    1. 首套房商业贷款：首付比例35%
    2. 首套房公积金贷款：首付比例20%
    3. 贷款利率：LPR+0基点（当前约3.85%）
    4. 公积金贷款上限：120万元（个人）/168万元（夫妻）
  summary: "北京首套房首付35%，公积金首付20%"
  keywords: ["北京", "首套房", "贷款", "首付"]
  source: "北京市住房公积金管理中心"
  priority: 9

- title: "北京市多子女家庭购房支持政策"
  category: "preference"
  city: "北京"
  content: |
    1. 二孩及以上京籍家庭可在五环外新购1套商品住房（不计入限购套数）
    2. 该政策适用于2023年11月起实施的优化限购措施
    3. 需提供户口本、出生医学证明等材料认定多子女身份
  summary: "北京多子女家庭可在五环外增购1套住房"
  keywords: ["北京", "多子女", "限购优化", "五环外"]
  source: "北京市住建委、北京市规自委（2023年11月联合通知）"
  priority: 8

- title: "北京市保障性住房配售政策"
  category: "preference"
  city: "北京"
  content: |
    1. 面向符合条件的无房家庭、新市民、青年人供应共有产权房和保障性租赁住房
    2. 共有产权房价格低于同地段商品房，产权份额一般为50%-95%
    3. 申请家庭需在京无房且符合收入、资产等准入条件
  summary: "北京提供共有产权房和保租房，面向无房群体定向配售"
  keywords: ["北京", "保障房", "共有产权房", "保租房"]
  source: "北京市保障性住房建设管理办公室"
  priority: 7

- title: "北京市住房公积金提取条件"
  category: "provident_fund"
  city: "北京"
  content: |
    公积金可提取情形：
    1. 购买、建造、翻建、大修自住住房
    2. 偿还住房贷款本息
    3. 租房（无自有住房，每月可提1500元或实际租金）
    4. 退休、出境定居、完全丧失劳动能力等
  summary: "北京公积金可用于购房、还贷、租房等情形提取"
  keywords: ["北京", "公积金", "提取", "租房"]
  source: "北京住房公积金管理中心"
  priority: 8

- title: "上海市购房限购政策"
  category: "policy"
  city: "上海"
  content: |
    1. 沪籍单身：限购1套
    2. 沪籍家庭：限购2套
    3. 非沪籍：需连续5年社保或纳税，限购1套
    4. 临港新片区：非沪籍3年社保可购1套
  summary: "上海限购政策：沪籍家庭2套，非沪籍需5年社保限1套"
  keywords: ["上海", "限购", "社保", "临港"]
  source: "上海房管局"
  priority: 10

- title: "深圳市购房限购政策"
  category: "policy"
  city: "深圳"
  content: |
    1. 深户家庭：限购2套
    2. 深户单身：限购1套
    3. 非深户：需连续5年社保或纳税，限购1套
    4. 落户3年内：社保满3年可购房
  summary: "深圳限购政策：深户家庭2套，非深户需5年社保"
  keywords: ["深圳", "限购", "社保", "户籍"]
  source: "深圳住建局"
  priority: 10

- title: "广州市购房限购政策"
  category: "policy"
  city: "广州"
  content: |
    1. 穗籍家庭：限购2套
    2. 穗籍单身：限购1套
    3. 非穗籍：需连续5年社保或纳税，限购1套
