- title: "北京市首套房认定及贷款利率优惠"
  category: "policy"
  city: "北京"
  content: |
    1. 全国范围内仅有1笔已结清的住房公积金贷款记录，在北京购房可按首套房认定
    2. 首套房商业贷款最低首付比例20%，公积金贷款利率2.85%
    3. 需主动向贷款机构提供全国贷款结清证明以申请首套资格
  summary: "全国仅1笔结清公积金贷款可享北京首套房待遇；操作方式：贷款申请时主动提交全国贷款结清证明；红利效果：首付比例低至20%，利率低至2.85%，节省利息数十万元"
  keywords: ["北京", "首套房", "公积金贷款", "利率优惠", "资格认定"]
  conditions:
    city: "北京"
  source: "北京住房公积金管理中心、中国人民银行北京分行"
  priority: 9

- title: "多子女家庭及绿色建筑购房公积金贷款额度上浮"
  category: "policy"
  city: "北京"
  content: |
    1. 二孩及以上家庭购买普通商品住房，公积金贷款最高额度可上浮至140万元（普通上限120万）
    2. 购买经认证的绿色建筑项目，同样适用额度上浮
    3. 需在贷款申请时主动提交户口本、出生医学证明或绿色建筑认证文件
  summary: "多子女家庭或购绿色建筑，北京公积金贷款额度最高140万；操作方式：贷款时提交子女证明或绿色建筑认证；红利效果：多贷20万元，显著降低月供或减少商贷依赖"
  keywords: ["北京", "多子女", "绿色建筑", "公积金贷款", "额度上浮"]
  conditions:
    city: "北京"
  source: "北京住房公积金管理中心"
  priority: 8

- title: "购房人可提取公积金支付首付款"
  category: "policy"
  city: "北京"
  content: |
    1. 购房人可在签订网签合同后，申请提取本人及配偶公积金账户余额用于支付首付款
    2. 需同步申请公积金贷款，办理“提取+贷款”联办业务
    3. 提取资金直接划入开发商预售资金监管账户
  summary: "北京支持公积金提取付首付；操作方式：网签后30日内申请‘提取+贷款’联办；红利效果：缓解首付压力，提高资金使用效率"
  keywords: ["北京", "公积金提取", "首付款", "联办"]
  conditions:
    city: "北京"
  source: "北京住房公积金管理中心"
  priority: 8

- title: "换购住房个人所得税退税政策"
  category: "policy"
  city: "北京"
  content: |
    1. 出售自有住房后1年内重新购房，可申请退还出售时缴纳的个人所得税
    2. 退税金额 = 旧房转让所得 × 20%（或核定征收率）
    3. 需在新房完成网签后，向主管税务机关主动提交退税申请材料
  summary: "北京卖旧买新1年内可退个税；操作方式：新房网签后向税务局提交退税申请；红利效果：一套盈利100万的二手房可退税约20万元"
  keywords: ["北京", "个税退税", "卖旧买新", "换房"]
  conditions:
    city: "北京"
  source: "国家税务总局北京市税务局"
  priority: 9

- title: "不满2年住房销售增值税减按3%征收"
  category: "policy"
  city: "北京"
  content: |
    1. 自2026年1月1日起，个人销售持有不满2年的住房，增值税由5%降至3%
    2. 系统自动适用新税率，但房产证登记时间如有误差需主动申请更正
  summary: "北京不满2年住房增值税降至3%；操作方式：过户缴税时确认房产证日期，有误则申请更正；红利效果：400万元房产可节省增值税约8万元"
  keywords: ["北京", "增值税", "二手房", "税收减免"]
  conditions:
    city: "北京"
  source: "国家税务总局北京市税务局"
  priority: 7

- title: "五环外非京籍购房社保要求缩短至24个月"
  category: "policy"
  city: "北京"
  content: |
    1. 非京籍家庭在五环外购房，社保或个税缴纳年限由60个月缩短为24个月
    2. 仍需满足在京无房且连续缴纳条件
    3. 购房前建议通过“京通”小程序打印社保证明确认资格
  summary: "北京五环外非京籍购房社保要求降至2年；操作方式：购房前通过‘京通’或人社局官网打印社保证明并核验资格；红利效果：提前2–3年获得购房资格，加快安家进程"
  keywords: ["北京", "五环外", "非京籍", "社保", "限购松绑"]
  conditions:
    city: "北京"
  source: "北京市住房和城乡建设委员会"
  priority: 9

- title: "二孩及以上家庭可在五环内增购1套住房"
  category: "policy"
  city: "北京"
  content: |
    1. 已有1套住房的京籍或符合条件的非京籍二孩及以上家庭，可在五环内再购1套
    2. 需在购房资格核验阶段主动上传子女出生证明、户口本等材料
    3. 不自动识别，必须人工申报
  summary: "北京多子女家庭五环内可多买1套房；操作方式：资格核验时主动上传子女证明材料；红利效果：突破限购限制，实现改善型住房需求"
  keywords: ["北京", "多子女", "增购", "五环内", "资格核验"]
  conditions:
    city: "北京"
  source: "北京市住房和城乡建设委员会"
  priority: 8
