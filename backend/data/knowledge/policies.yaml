    2. 沪籍家庭：限购2套
    3. 非沪籍：需连续5年社保或纳税，限购1套
    4. 临港新片区：非沪籍3年社保可购1套
  summary: "上海限购政策：沪籍家庭2套，非沪籍需5年社保限1套"
  keywords: ["上海", "限购", "社保", "临港"]
