version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: assetflow-postgres
    environment:
      POSTGRES_USER: assetflow
      POSTGRES_PASSWORD: assetflow123
      POSTGRES_DB: assetflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetflow -d assetflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: assetflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AssetFlow Backend (for development)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: assetflow-backend
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=assetflow
      - POSTGRES_PASSWORD=assetflow123
      - POSTGRES_DB=assetflow
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=development
      - USE_MOCK_SEARCH=true
    volumes:
      - .:/app
      - /app/.venv  # Exclude .venv from volume mount
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data: